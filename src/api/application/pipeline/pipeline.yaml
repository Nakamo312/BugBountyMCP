defaults:
  max_parallelism: ORCHESTRATOR_MAX_CONCURRENT
  execution_delay: 0
  execution_mode: scheduled
  scope: none

events:
  raw_domains_discovered:
    queue: validation
  subdomain_discovered:
    queue: discovery
  asn_discovered:
    queue: discovery
  cidr_discovered:
    queue: discovery
  ips_expanded:
    queue: enumeration
  cidr_sliced:
    queue: enumeration
  ips_aggregated:
    queue: enumeration
  dnsx_basic_scan_requested:
    queue: validation
  dnsx_deep_scan_requested:
    queue: validation
  dnsx_filtered_hosts:
    queue: validation
  dnsx_basic_results_batch:
    queue: validation
  dnsx_deep_results_batch:
    queue: validation
  dnsx_ptr_results_batch:
    queue: validation
  host_discovered:
    queue: analysis
  scan_results_batch:
    queue: analysis
  tlsx_scan_requested:
    queue: analysis
  tlsx_results_batch:
    queue: analysis
  cert_san_discovered:
    queue: analysis
  gau_discovered:
    queue: analysis
  katana_results_batch:
    queue: analysis
  js_files_discovered:
    queue: analysis
  mantra_results_batch:
    queue: analysis
  ffuf_results_batch:
    queue: analysis
  subjack_results_batch:
    queue: analysis
  naabu_results_batch:
    queue: analysis
  smap_scan_requested:
    queue: enumeration
  smap_results:
    queue: enumeration
  ports_discovered:
    queue: enumeration
  hakip2host_scan_requested:
    queue: enumeration

capabilities:
  subfinder:
    label: Subfinder
    request_event: subfinder_scan_requested
    queue: discovery
    default_profile: passive-recon
    scope: none
    profiles:
      passive-recon:
        label: Passive subdomain discovery
        safety_level: passive
        allowed_options: [timeout, probe]

  httpx:
    label: HTTPX
    request_event: httpx_scan_requested
    queue: analysis
    default_profile: safe-web-probe
    scope: confidence
    profiles:
      safe-web-probe:
        label: Safe HTTP probing
        safety_level: safe_active
        options:
          timeout:
            type: integer
            default: 60
            minimum: 1
            maximum: 120
        budgets:
          max_duration_seconds: 120
          max_targets: 100
          rate_per_second: 50
          concurrency: 5

  katana:
    label: Katana
    request_event: katana_scan_requested
    queue: analysis
    default_profile: safe-crawl
    scope: confidence
    profiles:
      safe-crawl:
        label: Safe crawl
        safety_level: safe_active
        options:
          depth:
            type: integer
            default: 2
            minimum: 1
            maximum: 5
          js_crawl:
            type: boolean
            default: true
          headless:
            type: boolean
            default: false
          timeout:
            type: integer
            default: 120
            minimum: 1
            maximum: 600
        budgets:
          max_duration_seconds: 600
          max_targets: 20
          rate_per_second: 10
          concurrency: 2

  playwright:
    label: Playwright
    request_event: playwright_scan_requested
    queue: analysis
    default_profile: browser-crawl
    scope: strict
    profiles:
      browser-crawl:
        label: Browser crawl with network capture
        safety_level: active
        allowed_options: [depth, timeout]
        requires_approval: true

  gau:
    label: GAU/Waymore
    request_event: gau_scan_requested
    queue: analysis
    default_profile: archive-url-discovery
    scope: strict
    profiles:
      archive-url-discovery:
        label: Archived URL discovery
        safety_level: passive
        allowed_options: [include_subs, timeout]

  linkfinder:
    label: LinkFinder
    request_event: linkfinder_scan_requested
    queue: analysis
    default_profile: js-endpoint-extraction
    scope: confidence
    profiles:
      js-endpoint-extraction:
        label: JavaScript endpoint extraction
        safety_level: safe_active
        allowed_options: [timeout]

  ffuf:
    label: FFUF
    request_event: ffuf_scan_requested
    queue: analysis
    default_profile: content-discovery-light
    scope: strict
    profiles:
      content-discovery-light:
        label: Light content discovery
        safety_level: active
        options:
          timeout:
            type: integer
            default: 300
            minimum: 1
            maximum: 600
        budgets:
          max_duration_seconds: 600
          max_targets: 1
          rate_per_second: 10
          concurrency: 5
        requires_approval: true

  amass:
    label: Amass
    request_event: amass_scan_requested
    queue: discovery
    default_profile: passive-enum
    scope: none
    profiles:
      passive-enum:
        label: Passive infrastructure enumeration
        safety_level: passive
        allowed_options: [active, timeout]
      active-enum:
        label: Active infrastructure enumeration
        safety_level: active
        allowed_options: [active, timeout]
        requires_approval: true

  dnsx:
    label: DNSx
    request_event: dnsx_scan_requested
    queue: validation
    default_profile: dns-validate
    scope: none
    profiles:
      dns-validate:
        label: DNS validation
        safety_level: safe_active
        allowed_options: [mode, timeout]

  dnsx-ptr:
    label: DNSx PTR
    request_event: dnsx_ptr_scan_requested
    queue: validation
    default_profile: reverse-dns
    scope: none
    profiles:
      reverse-dns:
        label: Reverse DNS lookup
        safety_level: safe_active
        allowed_options: [mode, timeout]

  subjack:
    label: Subjack
    request_event: subjack_scan_requested
    queue: analysis
    default_profile: takeover-check
    scope: confidence
    profiles:
      takeover-check:
        label: Subdomain takeover check
        safety_level: safe_active
        allowed_options: [timeout]

  asnmap:
    label: ASNMap
    request_event: asnmap_scan_requested
    queue: discovery
    default_profile: asn-discovery
    scope: none
    profiles:
      asn-discovery:
        label: ASN and CIDR discovery
        safety_level: passive
        allowed_options: [mode, timeout]

  mapcidr:
    label: MapCIDR
    request_event: mapcidr_scan_requested
    queue: enumeration
    default_profile: cidr-expand
    scope: none
    profiles:
      cidr-expand:
        label: CIDR expansion
        safety_level: passive
        allowed_options: [skip_base, skip_broadcast, shuffle, timeout]

  naabu:
    label: Naabu
    request_event: naabu_scan_requested
    queue: analysis
    default_profile: passive-ports
    scope: strict
    profiles:
      passive-ports:
        label: Passive port discovery
        safety_level: passive
        options:
          ports:
            type: string
          top_ports:
            type: string
            default: "1000"
            enum: ["100", "1000", "full"]
          rate:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
          scan_mode:
            type: string
            default: passive
            enum: [passive]
          scan_type:
            type: string
            default: c
            enum: [c, s]
          exclude_cdn:
            type: boolean
            default: true
          timeout:
            type: integer
            default: 300
            minimum: 1
            maximum: 300
        budgets:
          max_duration_seconds: 300
          max_targets: 100
          rate_per_second: 10
          concurrency: 5
      connect-top-100:
        label: Top 100 TCP connect scan
        safety_level: active
        options:
          ports:
            type: string
          top_ports:
            type: string
            default: "100"
            enum: ["100", "1000"]
          rate:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
          scan_mode:
            type: string
            default: active
            enum: [active]
          scan_type:
            type: string
            default: c
            enum: [c]
          exclude_cdn:
            type: boolean
            default: true
          timeout:
            type: integer
            default: 600
            minimum: 1
            maximum: 600
        budgets:
          max_duration_seconds: 600
          max_targets: 100
          rate_per_second: 100
          concurrency: 5
        requires_approval: true

  mantra:
    label: Mantra
    request_event: mantra_scan_requested
    queue: analysis
    default_profile: js-secret-analysis
    scope: confidence
    profiles:
      js-secret-analysis:
        label: JavaScript secret analysis
        safety_level: safe_active
        allowed_options: [timeout]

workers:
  httpx:
    type: scan
    inputs:
      - subdomain_discovered
      - gau_discovered
      - dnsx_filtered_hosts
      - httpx_scan_requested
    outputs:
      host_discovered: new_hosts
      js_files_discovered: js_files
    runner: HTTPXCliRunner
    parser: HTTPXProcessEventParser
    processor: HTTPXBatchProcessor
    ingestor: HTTPXResultIngestor
    max_parallelism: ORCHESTRATOR_MAX_CONCURRENT
    max_targets_per_run: 100
    retry:
      max_attempts: 2
      backoff_seconds: 30
      terminal_outcomes: [tool_failed]
    scope: confidence

  katana:
    type: scan
    inputs:
      - katana_scan_requested
      - host_discovered
    outputs:
      js_files_discovered: js_files
    runner: KatanaCliRunner
    parser: JSONStdoutProcessEventParser
    processor: KatanaBatchProcessor
    ingestor: KatanaResultIngestor
    max_parallelism: 2
    max_targets_per_run: 20
    execution_delay: ORCHESTRATOR_SCAN_DELAY
    scope: confidence

  playwright:
    type: scan
    inputs:
      - playwright_scan_requested
      - host_discovered
    outputs:
      js_files_discovered: js_files
    runner: PlaywrightCliRunner
    parser: JSONStdoutProcessEventParser
    processor: PlaywrightBatchProcessor
    ingestor: KatanaResultIngestor
    max_parallelism: 1
    max_targets_per_run: 5
    execution_delay: ORCHESTRATOR_SCAN_DELAY
    scope: strict

  linkfinder:
    type: scan
    inputs:
      - linkfinder_scan_requested
      - js_files_discovered
    outputs:
      gau_discovered: urls
    runner: LinkFinderCliRunner
    parser: LinkFinderStdoutParser
    processor: LinkFinderBatchProcessor
    ingestor: LinkFinderResultIngestor
    max_parallelism: 3
    scope: confidence

  mantra:
    type: scan
    inputs:
      - mantra_scan_requested
      - js_files_discovered
    outputs: {}
    runner: MantraCliRunner
    parser: MantraStdoutParser
    processor: MantraBatchProcessor
    ingestor: MantraResultIngestor
    max_parallelism: ORCHESTRATOR_MAX_CONCURRENT
    scope: confidence

  subfinder:
    type: scan
    inputs:
      - subfinder_scan_requested
    outputs:
      raw_domains_discovered: raw_domains
    runner: SubfinderCliRunner
    parser: SubfinderStdoutParser
    processor: SubfinderBatchProcessor
    ingestor: HostIngestor
    max_parallelism: ORCHESTRATOR_MAX_CONCURRENT
    scope: none

  waymore:
    type: scan
    inputs:
      - gau_scan_requested
    outputs:
      gau_discovered: urls
    runner: WaymoreCliRunner
    parser: URLStdoutLineResultParser
    processor: WaymoreBatchProcessor
    ingestor:
    max_parallelism: 2
    max_targets_per_run: 1
    scope: strict

  subjack:
    type: scan
    inputs:
      - subjack_scan_requested
      - subdomain_discovered
    outputs: {}
    runner: SubjackCliRunner
    parser: SubjackStdoutParser
    processor: SubjackBatchProcessor
    ingestor: SubjackResultIngestor
    max_parallelism: ORCHESTRATOR_MAX_CONCURRENT
    scope: confidence

  ffuf:
    type: scan
    inputs:
      - ffuf_scan_requested
      - host_discovered
    outputs: {}
    runner: FFUFCliRunner
    parser: FFUFStdoutParser
    processor: FFUFBatchProcessor
    ingestor: FFUFResultIngestor
    max_parallelism: 3
    max_targets_per_run: 1
    scope: strict
    runtime:
      mode: per_target
      target_shape: scalar
      artifact: per_target
      concurrency: 5

  amass:
    type: scan
    inputs:
      - amass_scan_requested
    outputs:
      subdomain_discovered: raw_domains
      ips_expanded: ips
      asn_discovered: asns
      cidr_discovered: cidrs
    runner: AmassCliRunner
    parser: AmassGraphParser
    processor: AmassBatchProcessor
    ingestor: AmassResultIngestor
    max_parallelism: ORCHESTRATOR_MAX_CONCURRENT
    scope: none
    runtime:
      mode: per_target
      target_shape: scalar
      artifact: per_target
      concurrency: 5

  asnmap:
    type: scan
    inputs:
      - asnmap_scan_requested
    outputs:
      asn_discovered: asns
      cidr_discovered: cidrs
    runner: ASNMapCliRunner
    parser: JSONStdoutProcessEventParser
    processor: ASNMapBatchProcessor
    ingestor: ASNMapResultIngestor
    max_parallelism: ORCHESTRATOR_MAX_CONCURRENT
    scope: none

  naabu:
    type: scan
    inputs:
      - naabu_scan_requested
    outputs: {}
    runner: NaabuCliRunner
    parser: JSONStdoutProcessEventParser
    processor: NaabuBatchProcessor
    ingestor: NaabuResultIngestor
    max_parallelism: ORCHESTRATOR_MAX_CONCURRENT
    scope: strict

  mapcidr_expand:
    type: scan
    inputs:
      - cidr_discovered
      - mapcidr_scan_requested
    outputs:
      ips_expanded: ips
    runner: MapCIDRExpandRunner
    parser: StdoutLineResultParser
    processor: MapCIDRBatchProcessor
    ingestor:
    max_parallelism: ORCHESTRATOR_MAX_CONCURRENT
    scope: none

  tlsx_default:
    type: scan
    inputs:
      - ips_expanded
      - tlsx_scan_requested
    outputs:
      raw_domains_discovered: raw_domains
    runner: TLSxDefaultRunner
    parser: JSONStdoutProcessEventParser
    processor: TLSxBatchProcessor
    ingestor: TLSxResultIngestor
    max_parallelism: ORCHESTRATOR_MAX_CONCURRENT
    scope: strict

  dnsx_discovered:
    type: scan
    inputs:
      - raw_domains_discovered
    outputs:
      ips_expanded: ips
      subdomain_discovered: hostnames
    runner: DNSxDeepRunner
    parser: JSONStdoutProcessEventParser
    processor: DNSxBatchProcessor
    ingestor: DNSxDiscoveryResultIngestor
    max_parallelism: ORCHESTRATOR_MAX_CONCURRENT
    scope: none

  dnsx_validate:
    type: scan
    inputs:
      - dnsx_scan_requested
    outputs:
      ips_expanded: ips
      subdomain_discovered: hostnames
    runner: DNSxDeepRunner
    parser: JSONStdoutProcessEventParser
    processor: DNSxBatchProcessor
    ingestor: DNSxResultIngestor
    max_parallelism: ORCHESTRATOR_MAX_CONCURRENT
    scope: strict

  dnsx_ptr:
    type: scan
    inputs:
      - dnsx_ptr_scan_requested
    outputs: {}
    runner: DNSxPtrRunner
    parser: JSONStdoutProcessEventParser
    processor: DNSxBatchProcessor
    ingestor: DNSxResultIngestor
    max_parallelism: ORCHESTRATOR_MAX_CONCURRENT
    scope: none

  smap:
    type: scan
    inputs:
      - smap_scan_requested
      - cidr_discovered
    outputs:
      ips_expanded: ips
      raw_domains_discovered: raw_domains
    runner: SmapCliRunner
    parser: JSONStdoutItemsProcessEventParser
    processor: SmapBatchProcessor
    ingestor: SmapResultIngestor
    max_parallelism: ORCHESTRATOR_MAX_CONCURRENT
    scope: none

  hakip2host:
    type: scan
    inputs:
      - hakip2host_scan_requested
      - ips_expanded
    outputs:
      raw_domains_discovered: raw_domains
    runner: Hakip2HostCliRunner
    parser: Hakip2HostStdoutParser
    processor: Hakip2HostBatchProcessor
    ingestor: HostIngestor
    max_parallelism: ORCHESTRATOR_MAX_CONCURRENT
    scope: confidence
    runtime:
      mode: batch
      target_shape: list
      artifact: per_run

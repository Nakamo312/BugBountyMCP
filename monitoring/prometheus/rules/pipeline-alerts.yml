groups:
  - name: pipeline-obligations
    rules:
      - alert: PrometheusTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Prometheus scrape target is down
          description: A monitored target has stopped responding to Prometheus scrapes.

      - alert: ContainerMemoryHigh
        expr: sum by (name) (container_memory_working_set_bytes{image!=""}) / clamp_min(sum by (name) (container_spec_memory_limit_bytes{image!=""}), 1) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Container memory usage is high
          description: A container is using more than 85 percent of its configured memory limit.

      - alert: RabbitMQReadyWithoutConsumers
        expr: sum by (queue) (rabbitmq_queue_messages_ready) > 0 and sum by (queue) (rabbitmq_queue_consumers) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: RabbitMQ queue has ready messages and no consumers
          description: Messages are waiting in a queue that no worker is consuming.

      - alert: RabbitMQUnackedGrowing
        expr: deriv(sum by (queue) (rabbitmq_queue_messages_unacked)[10m:]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: RabbitMQ unacked messages are growing
          description: Workers are receiving messages but not acknowledging them fast enough.

      - alert: PipelineScheduledOldestAgeHigh
        expr: max(pipeline_scheduled_state_oldest_age_seconds{status="queued"}) > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Scheduled pipeline work is too old
          description: The oldest queued scheduled node run has waited longer than 15 minutes.


      - alert: PipelineScheduledLeaseStuck
        expr: max(pipeline_scheduled_state_oldest_age_seconds{status="leased"}) > 180
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Scheduled lease is stuck
          description: A scheduled run has remained leased for more than 3 minutes without transitioning to running.

      - alert: PipelineScheduledRunningStale
        expr: max(pipeline_scheduled_state_oldest_age_seconds{status="running"}) > 7200
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Scheduled running run is stale
          description: A scheduled run has remained running for longer than the configured stale-running timeout.

      - alert: PipelineScheduledFlushingStale
        expr: max(pipeline_scheduled_state_oldest_age_seconds{status="flushing"}) > 900
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Scheduled flushing run is stale
          description: A scheduled run has remained flushing for longer than the configured stale-flushing timeout.

      - alert: PipelineRetryDueOldestAgeHigh
        expr: max(pipeline_retry_due_oldest_age_seconds) > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Retry due work is too old
          description: A retry-eligible node run has remained due for longer than 15 minutes.

      - alert: PipelineReconcileOldestAgeHigh
        expr: max(pipeline_reconcile_oldest_age_seconds) > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Reconcile-required work is too old
          description: A run requiring reconcile has remained unresolved for longer than 5 minutes.

      - alert: PipelineWorkerHeartbeatStale
        expr: time() - pipeline_worker_last_heartbeat_timestamp_seconds > 120
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Pipeline worker heartbeat is stale
          description: A configured pipeline worker has not produced a fresh heartbeat.

      - alert: PipelineWorkersSaturatedWithBacklog
        expr: sum(pipeline_worker_busy) / clamp_min(sum(pipeline_worker_capacity), 1) > 0.9 and sum(pipeline_scheduled_state_runs{status="queued"}) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Pipeline workers are saturated while backlog exists
          description: Runtime worker slots are mostly busy while scheduled work remains queued.

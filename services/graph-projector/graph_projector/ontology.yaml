  - content_type
  - response_header_keys
  - response_header_key_hash
  - body_sha256
  - body_size_bytes
  - body_size_bucket
  - body_present
  - exact_body_hash
  - structural_hash
  - schema_fingerprint
  - display_label
  source_references:
  - source_artifact_id
  - tool_run_id
  projections:
  - asset_exposure
  - program_exposure_topology
  - endpoint_neighborhood
  - evidence_path
  level: L2_WEB_API

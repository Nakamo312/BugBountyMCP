  - httpx
  - katana
  - ffuf
  - playwright
  parser_outputs:
  - http_observations
  query_templates:
  - program_exposure_topology
  - endpoint_neighborhood
  - evidence_path
  property_vs_node_rationale: ResponseShape is a node because many request shapes can yield the same response class, and one
    request shape can yield multiple response classes. Raw response payloads stay in artifact storage, not in Neo4j.
  retention: program_lifetime
  sensitivity: normal
  confidence_policy: Use parser-backed safe response fingerprints and keep max confidence across repeated observations.
  stale_policy: Refresh last_seen from repeated observations; response shapes remain stable by safe response fingerprints.
  identity:
    graph_key: response_shape_key
    source_properties:
    - response_shape_key
    key_policy: safe_response_status_content_family_and_structure

- description: Deprecated legacy probe node kept for old migrations; current candidate scoring is read-only and does not write probes.
  label: ActionExperienceProbe
  layer: lineage
  identity_properties:
  - program_id
  - probe_id
  required_properties:
  - program_id
  - probe_id
  optional_properties:

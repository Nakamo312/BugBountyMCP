name: bug_bounty_knowledge_graph
nodes:
- description: Bug bounty program boundary.
  label: Program
  layer: surface
  identity_properties:
  - program_id
  required_properties:
  - program_id
  optional_properties:
  - name
  source_references: []
  projections:
  - asset_exposure
  - endpoint_neighborhood
  - evidence_path
  level: L0_CORE
  maturity: experimental
  sources:
  - program_registry
  parser_outputs:
  - programs
  query_templates:
  - asset_exposure
  - evidence_path
  property_vs_node_rationale: Program is a node because every graph fact is scoped
    to a program and queries need program-bounded traversal.
  retention: program_lifetime
  sensitivity: normal
  confidence_policy: Use evidence-backed parser confidence; keep max confidence across
    repeated observations.
  stale_policy: Refresh last_seen from repeated observations; mark stale when source
    evidence stops reproducing the fact.
  identity:
    graph_key: program_id
    source_properties:
    - program_id
    key_policy: program_id

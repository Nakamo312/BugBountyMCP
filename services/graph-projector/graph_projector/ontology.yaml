  level: L0_CORE
  maturity: experimental
  sources:
  - surface_map
  parser_outputs:
  - surface_nodes
  query_templates:
  - surface_graph_math
  property_vs_node_rationale: SurfaceFingerprint is a node because graph algorithms need stable cross-snapshot feature anchors instead of snapshot-local SurfaceNode identities.
  retention: program_lifetime
  sensitivity: normal
  confidence_policy: Use deterministic surface-engine fingerprints.
  stale_policy: Fingerprint nodes are stable; snapshot membership changes through SurfaceNode and SurfaceDelta edges.
  identity:
    graph_key: fingerprint
    source_properties:
    - fingerprint
    key_policy: stable_surface_node_fingerprint

  maturity: deprecated
  sources:
  - action_experience_probe
  parser_outputs:
  - action_experience_probes
  query_templates:
  - action_outcome_experience_neighborhood
  property_vs_node_rationale: Deprecated; read-only Jaccard scoring now compares feature-key sets directly without graph-native probe nodes.
  retention: legacy_migration_only
  sensitivity: normal
  confidence_policy: Use caller-provided current-state features only; never treat the probe as evidence.
  stale_policy: Do not create new probes; legacy rows can be ignored or cleaned by maintenance.
  identity:
    graph_key: probe_id
    source_properties:
    - probe_id
    key_policy: request_probe_id

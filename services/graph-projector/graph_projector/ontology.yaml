    key_policy: snapshot_id_node_fingerprint
- description: Stable surface-node fingerprint shared across snapshots for graph similarity.
  label: SurfaceFingerprint
  layer: surface
  identity_properties:
  - program_id
  - fingerprint
  required_properties:
  - program_id
  - fingerprint
  optional_properties:

  - request_shape_key
  - endpoint_key
  - method
  - normalized_path
  - path_param_keys
  - query_keys
  optional_properties:
  - hostname
  - port
  - scheme
  - content_type
  - status_code
  - parameter_keys_by_location
  - parameter_count
  - response_header_keys
  - body_sha256
  - body_size_bytes
  - body_artifact_id
  - body_present
  - body_size_bucket
  - parameter_key_set
  - parameter_locations
  - semantic_hash
  - wire_hash
  - framing_hash
  - cache_key_candidate_hash
  - parser_normalized_hash
  - body_shape_hash
  - response_shape_key
  - response_family
  - response_header_key_hash
  - shape_fingerprint
  - display_label
  source_references:
  - source_artifact_id
  - tool_run_id
  projections:
  - asset_exposure
  - program_exposure_topology
  - endpoint_neighborhood
  - evidence_path
  level: L2_WEB_API
  maturity: experimental
  sources:
  - httpx
  - katana
  - ffuf
  - playwright
  parser_outputs:
  - http_observations
  query_templates:
  - program_exposure_topology
  - endpoint_neighborhood
  - evidence_path
  property_vs_node_rationale: RequestShape is a node because the graph needs request-level context without storing raw request
    bodies, header values, cookies, or secrets.
  retention: program_lifetime
  sensitivity: normal
  confidence_policy: Use parser-backed shape confidence; omit raw payload values.
  stale_policy: Refresh last_seen from repeated observations; request shapes remain stable by endpoint and safe key sets.
  identity:
    graph_key: request_shape_key
    source_properties:
    - endpoint_key
    - method
    - path_param_keys
    - query_keys
    key_policy: endpoint_method_safe_key_sets_and_safe_body_fingerprint

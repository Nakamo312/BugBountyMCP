services:
  postgres:
    image: postgres:16-alpine
    container_name: bb-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: bb-rabbitmq
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    command: ["sh", "-c", "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"]
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "15672:15672" 
      - "15692:15692"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  playwright:
    build:
      context: ./playwright
      dockerfile: Dockerfile
    container_name: bb-playwright
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; channel = grpc.insecure_channel('localhost:50051'); channel.close()"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bb-api
    env_file:
      - .env
    environment:
      API_HOST: ${API_HOST}
      API_PORT: ${API_PORT}

      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}

      LOG_LEVEL: ${LOG_LEVEL}
      TOOLS_PATH_PREFIX: ${TOOLS_PATH_PREFIX}
      PDCP_API_KEY: ${PDCP_API_KEY}
      RAW_OUTPUT_DIR: /app/data/raw_outputs
    ports:
      - "${API_PORT}:8000"
    volumes:
      - ./data/raw_outputs:/app/data/raw_outputs
      - ${HOST_GO_BIN:-/usr/go/bin/bin/}:/host_root/go_bin:ro
      - ${HOST_USR_BIN:-/usr/bin}:/host_root/usr_bin:ro
      - ${HOST_USR_LOCAL_BIN:-/usr/local/bin}:/host_root/usr_local_bin:ro
      - ${HOST_SECLISTS:-/usr/share/seclists}:/usr/share/seclists:ro
      - ${HOST_WORDLISTS:-/usr/share/wordlists}:/usr/share/wordlists:ro
      - ${HOST_USER_CONFIG:-/home/appuser/.config}:/home/appuser/.config
      - ${HOST_SUBJACK:-/usr/share/subjack}:/usr/share/subjack:ro
      - katana_browsers:/home/appuser/.cache/rod
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      playwright:
        condition: service_healthy
    restart: unless-stopped

  postgres-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bb-postgres-mcp
    env_file:
      - .env
    environment:
      PYTHONPATH: /app/src
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MCP_DSN: ${POSTGRES_MCP_DSN:-}
      POSTGRES_MCP_HOST: 0.0.0.0
      POSTGRES_MCP_PORT: 8010
      POSTGRES_MCP_TRANSPORT: http
      LOG_LEVEL: ${LOG_LEVEL}
    entrypoint: ["python", "-m", "api.presentation.mcp.postgres_server"]
    ports:
      - "${POSTGRES_MCP_PORT:-8010}:8010"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./BugBountyDashBoard
      dockerfile: Dockerfile
    container_name: bb-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: bb-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      api:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: bb-grafana
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      prometheus:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  katana_browsers:
  prometheus_data:
  grafana_data:

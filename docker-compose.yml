services:
  postgres:
    image: postgres:16-alpine
    container_name: bb-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: bb-neo4j
    profiles:
      - graph
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-bugbounty-neo4j-local}
      NEO4J_dbms_default__database: ${NEO4J_DATABASE:-neo4j}
    volumes:
      - neo4j_data:/data
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  graph-projector:
    build:
      context: ./services/graph-projector
      dockerfile: Dockerfile
    container_name: bb-graph-projector
    profiles:
      - graph
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NEO4J_ENABLED: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-bugbounty-neo4j-local}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      GRAPH_FACT_BATCH_POLL_SECONDS: ${GRAPH_FACT_BATCH_POLL_SECONDS:-1}
      GRAPH_FACT_BATCH_NOTIFY_CHANNEL: ${GRAPH_FACT_BATCH_NOTIFY_CHANNEL:-graph_fact_batches_changed}
    command: ["apply-loop"]
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: "no"

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: bb-opensearch
    profiles:
      - search
    environment:
      cluster.name: bugbounty-opensearch
      node.name: bb-opensearch
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  opensearch-dashboards:
    build:
      context: ./services/opensearch-dashboards
      dockerfile: Dockerfile
    container_name: bb-opensearch-dashboards
    profiles:
      - search
    ports:
      - "127.0.0.1:${OPENSEARCH_DASHBOARDS_PORT:-5601}:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped

  search-indexer:
    build:
      context: ./services/search-indexer
      dockerfile: Dockerfile
    container_name: bb-search-indexer
    profiles:
      - search
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      OPENSEARCH_URL: http://opensearch:9200
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    restart: "no"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: bb-rabbitmq
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    command: ["sh", "-c", "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"]
    ports:
      - "127.0.0.1:${RABBITMQ_PORT}:5672"
      - "127.0.0.1:15672:15672"
      - "127.0.0.1:15692:15692"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      start_period: 240s
      interval: 10s
      timeout: 10s
      retries: 18
    restart: unless-stopped

  playwright:
    build:
      context: ./playwright
      dockerfile: Dockerfile
    container_name: bb-playwright
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; channel = grpc.insecure_channel('localhost:50051'); channel.close()"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bb-api
    env_file:
      - .env
    environment:
      API_HOST: ${API_HOST}
      API_PORT: ${API_PORT}

      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}

      LOG_LEVEL: ${LOG_LEVEL}
      TOOLS_PATH_PREFIX: ${TOOLS_PATH_PREFIX}
      PDCP_API_KEY: ${PDCP_API_KEY}
      RAW_OUTPUT_DIR: /app/data/raw_outputs
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-bugbounty-neo4j-local}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      NEO4J_WORKBENCH_READ_TIMEOUT_SECONDS: ${NEO4J_WORKBENCH_READ_TIMEOUT_SECONDS:-20}
      NEO4J_WORKBENCH_MAX_LIMIT: ${NEO4J_WORKBENCH_MAX_LIMIT:-200}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    volumes:
      - ./data/raw_outputs:/app/data/raw_outputs
      - ${HOST_GO_BIN:-/usr/go/bin/bin/}:/host_root/go_bin:ro
      - ${HOST_USR_BIN:-/usr/bin}:/host_root/usr_bin:ro
      - ${HOST_USR_LOCAL_BIN:-/usr/local/bin}:/host_root/usr_local_bin:ro
      - ${HOST_SECLISTS:-/usr/share/seclists}:/usr/share/seclists:ro
      - ${HOST_WORDLISTS:-/usr/share/wordlists}:/usr/share/wordlists:ro
      - ${HOST_USER_CONFIG:-/home/appuser/.config}:/home/appuser/.config
      - ${HOST_SUBJACK:-/usr/share/subjack}:/usr/share/subjack:ro
      - katana_browsers:/home/appuser/.cache/rod
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      playwright:
        condition: service_healthy
    restart: unless-stopped

  postgres-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bb-postgres-mcp
    env_file:
      - .env
    environment:
      PYTHONPATH: /app/src
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MCP_DSN: ${POSTGRES_MCP_DSN:-}
      POSTGRES_MCP_HOST: 0.0.0.0
      POSTGRES_MCP_PORT: 8010
      POSTGRES_MCP_TRANSPORT: http
      LOG_LEVEL: ${LOG_LEVEL}
    entrypoint: ["python", "-m", "api.presentation.mcp.postgres_server"]
    ports:
      - "127.0.0.1:${POSTGRES_MCP_PORT:-8010}:8010"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./BugBountyDashBoard
      dockerfile: Dockerfile
    container_name: bb-frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "-T", "5", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: bb-prometheus
    profiles:
      - monitoring
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      api:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      cadvisor:
        condition: service_started
      node-exporter:
        condition: service_started
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: bb-cadvisor
    profiles:
      - monitoring
    ports:
      - "127.0.0.1:${CADVISOR_PORT:-8081}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    privileged: true
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: bb-node-exporter
    profiles:
      - monitoring
    command:
      - "--path.rootfs=/host"
    ports:
      - "127.0.0.1:${NODE_EXPORTER_PORT:-9100}:9100"
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: bb-grafana
    profiles:
      - monitoring
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      prometheus:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
  opensearch_data:
  katana_browsers:
  prometheus_data:
  grafana_data:
